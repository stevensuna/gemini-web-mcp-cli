[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-web-mcp-cli"
version = "0.9.7"
description = "MCP server and CLI for the Gemini web interface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jacob Ben David" },
]
keywords = ["gemini", "mcp", "cli", "google", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.0",
    "loguru>=0.7",
    "orjson>=3.9",
    "click>=8.1",
    "rich>=13.0",
    "rich-click>=1.8",
    "websockets>=12.0",
    "websocket-client>=1.7",
    "Pillow>=10.0",
    "mcp[cli]>=1.0,<2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]
all = [
    "gemini-web-mcp-cli[dev]",
]

[project.scripts]
gemcli = "gemini_web_mcp_cli.cli:main"
gemini-web-mcp = "gemini_web_mcp_cli.mcp:main"

[project.urls]
Homepage = "https://github.com/jacob-bd/gemini-web-mcp-cli"
Repository = "https://github.com/jacob-bd/gemini-web-mcp-cli"
Issues = "https://github.com/jacob-bd/gemini-web-mcp-cli/issues"
Changelog = "https://github.com/jacob-bd/gemini-web-mcp-cli/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_web_mcp_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
